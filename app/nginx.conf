server {
    listen 80;
    server_name _;

    # Health endpoint probed by BOTH the ALB target group and the ECS
    # container health check. Kept separate from / so a slow homepage
    # never causes a false unhealthy signal.
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy"}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Do not advertise the nginx version.
    server_tokens off;
}
