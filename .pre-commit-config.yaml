# Local quality gates. Install once with:  pre-commit install
#
# WHY BOTH pre-commit AND CI?
#   pre-commit  = fast feedback, catches mistakes before they enter git history
#                 (critical for secrets — once committed, history is forever).
#   CI          = the authoritative gate. pre-commit can be bypassed with
#                 `git commit --no-verify`; CI cannot.
# You need both: one for speed, one for enforcement.

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--tf-init-args=-upgrade"]
      - id: terraform_tflint
        args: ["--args=--config=__GIT_WORKING_DIR__/.tflint.hcl"]
      - id: terraform_docs
        args: ["--args=--lockfile=false"]
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact
          - --args=--skip-path=examples

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key        # blocks committing SSH/TLS private keys
      - id: check-yaml

  # Secret scanning. Catches AWS keys, tokens, high-entropy strings.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
