# Automated dependency updates.
#
# WHY THIS MATTERS FOR INFRASTRUCTURE:
#   Providers and actions are pinned for reproducibility, which means they also
#   go stale silently. Dependabot opens a PR when a new version is available,
#   and because every PR runs the full plan + test pipeline, an upgrade is
#   validated before a human ever looks at it.
version: 2

updates:
  - package-ecosystem: "terraform"
    directories:
      - "/bootstrap"
      - "/modules/vpc"
      - "/modules/ecs"
      - "/modules/rds"
      - "/modules/ecr"
      - "/environments/dev"
      - "/environments/staging"
      - "/environments/prod"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(app)"
