# =============================================================================
# DRIFT DETECTION
#
# Terraform state records what Terraform BELIEVES exists. Reality can diverge:
# someone edits a security group in the console, AWS changes a default, a
# resource is deleted manually. That gap is called DRIFT.
#
# This scheduled job runs a plan against the live environment and fails if the
# plan is non-empty — i.e. if reality no longer matches the code.
# =============================================================================
name: Drift Detection

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_VERSION: "1.11.4"
  AWS_REGION: eu-west-3

jobs:
  detect:
    name: Detect drift in dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-drift-${{ github.run_id }}

      - name: Init
        working-directory: environments/dev
        run: terraform init -input=false

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      - name: Plan with detailed exit code
        id: drift
        working-directory: environments/dev
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false \
            -var-file=dev.tfvars -no-color > drift.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Open an issue if drift was detected
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/drift.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Infrastructure drift detected in dev (${new Date().toISOString().split('T')[0]})`,
              body: `The live \`dev\` environment no longer matches the committed configuration.\n\n<details><summary>Plan output</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`,
              labels: ['drift', 'infrastructure']
            });
